services:
  nfce-api:
    build: .
    container_name: nfce-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/market.db}"
      SEFAZ_MIN_INTERVAL_SECONDS: "${SEFAZ_MIN_INTERVAL_SECONDS:-15}"
      SEFAZ_MAX_RETRIES: "${SEFAZ_MAX_RETRIES:-2}"
      SEFAZ_RETRY_BASE_SECONDS: "${SEFAZ_RETRY_BASE_SECONDS:-5}"
      NFCE_MAX_HTML_CHARS: "${NFCE_MAX_HTML_CHARS:-5242880}"
      NFCE_MAX_RESPONSE_BYTES: "${NFCE_MAX_RESPONSE_BYTES:-8388608}"
      NFCE_SAVE_DEBUG_HTML: "${NFCE_SAVE_DEBUG_HTML:-false}"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
